# Runs the update script once a day on GitHub and saves the new stats.js.
# It starts working as soon as this project is pushed to a GitHub repository.
name: Update stats

on:
  schedule:
    - cron: "41 2 * * *"   # every day at 02:41 UTC
  workflow_dispatch:        # adds a "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-stats.mjs
      - name: Save the new numbers
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add stats.js history
          git diff --cached --quiet || git commit -m "Update stats"
          git push
